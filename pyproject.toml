[project]
name = "ve-tay"
version = "0.1.0"
description = "Whiteboard animation video generator from SVG vector graphics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "svgpathtools>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
